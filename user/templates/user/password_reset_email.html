<!DOCTYPE html>
<html>
<head>
    <style>
        .card {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 400px;
            margin: 20px auto;
            padding: 30px;
            border-radius: 15px;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            text-align: center;
        }
        .logo { color: #ff6b6b; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .token {
            display: inline-block;
            background: #ffffff;
            border: 2px dashed #ff6b6b;
            color: #333;
            font-size: 28px;
            font-weight: bold;
            padding: 10px 20px;
            margin: 20px 0;
            letter-spacing: 2px;
        }
        .footer { font-size: 12px; color: #888; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">SOUP-FYP</div>
        <h2>Password Reset</h2>
        <p>Hello <strong>{{ username }}</strong>,</p>
        <p>Use the code below to reset your password. It will expire soon!</p>
        <div class="token">{{ reset_password_token }}</div>
        <p>If you didn't request this, just ignore this email.</p>
        <div class="footer">© 2026 SOUP-FYP Team</div>
    </div>
</body>
</html>
